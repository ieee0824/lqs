name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  go-aws-sdk-integration:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum
      - run: cargo build --locked
      - name: Test through AWS SDK for Go v2
        env:
          LQS_BIND_ADDR: 127.0.0.1:9324
          LQS_BASE_URL: http://127.0.0.1:9324
          LQS_DATABASE_PATH: ${{ runner.temp }}/lqs.sqlite
          LQS_ENDPOINT: http://127.0.0.1:9324
        run: |
          set -euo pipefail
          target/debug/lqs >"${RUNNER_TEMP}/lqs.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent "${LQS_ENDPOINT}/health" >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${RUNNER_TEMP}/lqs.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent "${LQS_ENDPOINT}/health" >/dev/null

          cd integration
          go test -v ./...
      - name: Show server log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/lqs.log"
