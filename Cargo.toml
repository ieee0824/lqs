[package]
name = "lqs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
md5 = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
